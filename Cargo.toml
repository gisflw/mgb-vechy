[package]
name = "mgb"
version = "0.1.0"
edition = "2024"
description = "MGB tools for hydrography and model inputs"
license-file = "LICENSE"
readme = "README.md"
default-run = "mgb"

[dependencies]
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
csv = "1"
gdal = "0.19"
gdal-sys = "0.12"
geos = { version = "11", features = ["v3_11_0"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[[example]]
name = "jacui"
path = "examples/jacui.rs"
